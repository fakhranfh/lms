name: Laravel

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

permissions:
  contents: read

jobs:
  pint-larastan:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, pdo, pdo_sqlite, sqlite3
        coverage: none

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: vendor
        key: composer-${{ hashFiles('composer.lock') }}
        restore-keys: composer-

    - name: Install Composer dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Copy .env
      run: cp .env.example .env

    - name: Generate key
      run: php artisan key:generate

    - name: Check code style (Pint)
      run: vendor/bin/pint --test --format agent

    - name: Static analysis (Larastan)
      run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  laravel-tests:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db: [mysql, pgsql]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: lms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      pgsql:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, pdo, pdo_sqlite, sqlite3, pdo_mysql, pdo_pgsql
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: vendor
        key: composer-${{ hashFiles('composer.lock') }}
        restore-keys: composer-

    - name: Install Composer dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Install NPM dependencies
      run: npm ci

    - name: Build assets
      run: npm run build

    - name: Copy .env
      run: cp .env.example .env

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 775 storage bootstrap/cache

    - name: Run migrations (mysql)
      if: matrix.db == 'mysql'
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: lms_test
        DB_USERNAME: root
        DB_PASSWORD: ""
        APP_URL: http://lms.local
        APP_DOMAIN: lms.local
      run: php artisan migrate --force

    - name: Run migrations (pgsql)
      if: matrix.db == 'pgsql'
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: lms_test
        DB_USERNAME: postgres
        DB_PASSWORD: postgres
        APP_URL: http://lms.local
        APP_DOMAIN: lms.local
      run: php artisan migrate --force

    - name: Execute tests (Unit and Feature tests) via Pest (mysql)
      if: matrix.db == 'mysql'
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: lms_test
        DB_USERNAME: root
        DB_PASSWORD: ""
        APP_URL: http://lms.local
        APP_DOMAIN: lms.local
      run: php artisan test --compact

    - name: Execute tests (Unit and Feature tests) via Pest (pgsql)
      if: matrix.db == 'pgsql'
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: lms_test
        DB_USERNAME: postgres
        DB_PASSWORD: postgres
        APP_URL: http://lms.local
        APP_DOMAIN: lms.local
      run: php artisan test --compact
